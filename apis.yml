aid: palm
name: Palm
description: >-
  Palm is an AI cash flow forecasting platform for corporate treasury and finance
  teams. It sits above existing Treasury Management Systems (TMS) and ERPs,
  unifying visibility across cash positions and forecasting liquidity directly
  from bank and transaction data. Palm learns the timing and size of recurring
  cash flows from historical transactions to keep a rolling 13-week-and-longer
  forecast current automatically, and combines ERP data, bank transactions, and
  25+ AI models to improve forecast accuracy by over 60%. The product spans AI
  cash forecasting, what-if scenario modeling, continuous forecast-vs-actual
  variance analysis, automated daily cash positioning across banks and
  currencies, surplus-cash investment identification, board-ready treasury
  reporting, and a "Pulse" anomaly-detection assistant. Palm is a speedinvest
  portfolio company. It integrates with TMS (Coupa, FIS, ION, Kyriba), banks
  (Citi, HSBC, J.P. Morgan), investment platforms, data warehouses, and ERPs
  (SAP, IFS), but does not publish a public developer API.
